<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        sans: ['Ubuntu', 'Arial', 'system-ui', 'sans-serif'],
        serif: ['Ubuntu', 'Arial', 'sans-serif'],
        mono: ['"Ubuntu Mono"', 'monospace'],
      },
      colors: {
        bone: '#FBFBFA',
        ink: '#111111',

        line: '#EAEAEA',
      },
    }

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,400;1,500&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=29" />
</head>
<body class="bg-bone text-ink font-sans antialiased overflow-x-hidden">

<!-- Grain -->
<div class="grain" aria-hidden="true"></div>

<!-- NAV : Fluid Island -->
<header id="siteHeader" class="fixed top-0 left-0 right-0 z-[80] flex justify-center px-4 pt-5">
  <nav id="islandNav" class="flex items-center gap-1 bg-white/80 backdrop-blur-2xl border border-black/[0.06] rounded-full pl-3.5 pr-2 py-2 shadow-[0_8px_40px_rgba(0,0,0,0.06)]">
    <a href="https://closof.site#beranda" class="mr-2 sm:mr-4 flex items-center gap-2 shrink-0">
      <span class="w-8 h-8 rounded-full bg-ink text-white flex items-center justify-center text-[17px] font-semibold leading-none">C</span>
      <span class="hidden sm:block font-semibold tracking-tight text-[15px]">Closof Dev</span>
    </a>
    <div class="hidden md:flex items-center gap-1 text-[14px] font-medium">
      <a href="https://closof.site#beranda" data-nav="beranda" data-i18n="nav_home" class="nav-link">Beranda</a>
      <a href="https://closof.site#tentang" data-nav="tentang" data-i18n="nav_about" class="nav-link">Tentang</a>
      <a href="#project" data-nav="project" data-i18n="nav_projects" class="nav-link is-active">Project</a>
      <a href="https://closof.site#kontak" data-nav="kontak" data-i18n="nav_contact" class="nav-link">Kontak</a>
    </div>

    <!-- Divider pemisah navigasi dan bahasa -->
    <div class="w-[1px] h-4 bg-black/10 mx-1 shrink-0"></div>

    <!-- Language Dropdown (Ujung Kanan) -->
    <div id="langPicker" class="relative shrink-0">
      <button id="langBtn" type="button" aria-expanded="false" aria-haspopup="true" class="flex items-center gap-1 px-2.5 py-1.5 rounded-full text-[13px] font-semibold tracking-wide text-ink/85 hover:text-ink hover:bg-black/5 transition-all duration-200 cursor-pointer">
        <span id="langCurrentText">ID</span>
        <svg id="langChevron" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>

      <!-- Dropdown Popup -->
      <div id="langMenu" class="lang-dropdown-menu">
        <button type="button" data-lang="id" class="lang-option is-active">
          <span>Indonesia</span>
        </button>
        <button type="button" data-lang="en" class="lang-option">
          <span>English</span>
        </button>
      </div>
    </div>

    <!-- Hamburger -->
    <button id="menuBtn" aria-label="Menu" class="md:hidden w-10 h-10 grid place-items-center rounded-full hover:bg-black/5">
      <span class="burger"><i></i><i></i></span>
    </button>
  </nav>
</header>

<!-- Mobile overlay -->
<div id="mobileMenu" class="fixed inset-0 z-[75] bg-white/85 backdrop-blur-3xl">
  <div class="h-full flex flex-col justify-center px-10 gap-2">
    <p data-i18n="nav_drawer_title" class="font-mono text-[11px] uppercase tracking-[0.25em] text-muted mb-4 mask-item">Navigasi</p>
    <a href="https://closof.site#beranda" data-i18n="nav_home" class="mobile-link mask-item">Beranda</a>
    <a href="https://closof.site#tentang" data-i18n="nav_about" class="mobile-link mask-item">Tentang</a>
    <a href="#project" data-i18n="nav_projects" class="mobile-link mask-item is-active">Project</a>
    <a href="https://closof.site#kontak" data-i18n="nav_contact" class="mobile-link mask-item">Kontak</a>
    <div class="mask-item mt-8 flex gap-3">
      <a href="#" class="soc">IG</a><a href="#" class="soc">GH</a><a href="#" class="soc">LI</a>
    </div>
  </div>
</div>

<main class="pt-24 sm:pt-28">
<!-- ============ PROJECT ============ -->
<section id="project" class="py-16 md:py-24 px-4 bg-white border-y border-line relative overflow-hidden min-h-[85vh]">
  <div class="max-w-5xl mx-auto">
    <div class="text-center max-w-xl mx-auto">
      <h1 data-i18n="projects_title" class="reveal text-[clamp(2.2rem,4.8vw,3.2rem)] tracking-[-0.02em] font-semibold leading-tight">Project</h1>
      <p class="reveal text-muted mt-3 text-[16px]">
        <span data-i18n="projects_subtitle">Berikut beberapa project yang pernah dikembangkan.</span>
        <a href="https://closof.site" class="text-ink font-medium underline underline-offset-4 hover:opacity-75 transition-opacity ml-1">
          <span data-i18n="project_back_home">Kembali ke beranda</span>
        </a>
      </p>
    </div>

    <!-- Filter Kategori Proyek -->
    <div id="projectFilters" class="reveal mt-8 flex flex-wrap items-center justify-center gap-2">
      <button type="button" class="filter-tab is-active" data-filter="all">
        <span data-i18n="filter_all">Semua</span>
        <span class="filter-count">32</span>
      </button>
      <button type="button" class="filter-tab" data-filter="web">
        <span data-i18n="filter_web">Web</span>
        <span class="filter-count">17</span>
      </button>
      <button type="button" class="filter-tab" data-filter="mobile">
        <span data-i18n="filter_mobile">Mobile</span>
        <span class="filter-count">3</span>
      </button>
      <button type="button" class="filter-tab" data-filter="desktop">
        <span data-i18n="filter_desktop">Desktop &amp; Sistem</span>
        <span class="filter-count">5</span>
      </button>
      <button type="button" class="filter-tab" data-filter="ai">
        <span data-i18n="filter_ai">AI &amp; LLM</span>
        <span class="filter-count">7</span>
      </button>
    </div>

    <div id="projectGrid" class="grid md:grid-cols-2 gap-8 md:gap-10 mt-8"></div>

    <!-- Extra Projects (Expandable) -->
    <div id="projectExtraWrap" class="project-expand-wrap">
      <div class="project-expand-inner">
        <div id="projectGridExtra" class="grid md:grid-cols-2 gap-8 md:gap-10 pt-8 md:pt-10"></div>
      </div>
    </div>

    <!-- Tombol Expand / Collapse Project -->
    <div id="projectToggleWrap" class="text-center">
      <button id="projectToggleBtn" type="button" aria-expanded="false" class="btn-project-toggle">
        <span id="projectToggleText" data-i18n="projects_toggle_more">Lainnya</span>
      </button>
    </div>

    <div class="mt-14">
      <p data-i18n="projects_tech_title" class="reveal font-mono text-[11px] uppercase tracking-[0.2em] text-muted">Tech yang dipakai di project ini</p>
      <div id="projectTechStack" class="mt-5 grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3"></div>
    </div>
  </div>
</section>
</main>

<!-- Footer -->
<footer class="border-t border-line bg-white/70 px-4 py-8">
  <div class="max-w-5xl mx-auto text-center">
    <p data-i18n-html="footer_text" class="text-[14px] text-muted">© 2026 <span class="text-ink font-medium">Closof Dev</span> — Fullstack &amp; Software Developer</p>
  </div>
</footer>

<!-- Tombol kembali ke atas (floating kanan bawah) -->
<button id="toTop" aria-label="Kembali ke atas" class="to-top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>

<script src="script.js?v=38"></script>
